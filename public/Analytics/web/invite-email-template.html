<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Rieng Radio Analytics access</title>
</head>
<body style="margin:0;padding:0;background:#f8f9fa;font-family:Arial,Helvetica,sans-serif;color:#202124">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f8f9fa">
    <tr>
      <td align="center" style="padding:36px 16px">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px">
          <tr>
            <td style="padding:0 2px 20px 2px">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td valign="middle" style="padding-right:12px">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0" aria-label="Analytics">
                      <tr>
                        <td valign="bottom" style="padding-right:3px"><div style="width:6px;height:13px;background:#e37400;border-radius:3px"></div></td>
                        <td valign="bottom" style="padding-right:3px"><div style="width:6px;height:21px;background:#f9ab00;border-radius:3px"></div></td>
                        <td valign="bottom"><div style="width:6px;height:29px;background:#fbbc04;border-radius:3px"></div></td>
                      </tr>
                    </table>
                  </td>
                  <td valign="middle">
                    <div style="font-size:20px;line-height:24px;font-weight:500;color:#3c4043">Rieng Radio Analytics</div>
                    <div style="font-size:12px;line-height:18px;color:#80868b">Reporting portal</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="background:#ffffff;border:1px solid #dadce0;border-radius:12px;overflow:hidden">
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding:36px 40px 12px 40px">
                    <div style="font-size:12px;line-height:18px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#1a73e8;margin-bottom:12px">Analytics access</div>
                    <h1 style="margin:0;font-size:28px;line-height:36px;font-weight:500;color:#202124">Hello,</h1>
                    <p style="margin:18px 0 0;font-size:15px;line-height:24px;color:#5f6368">
                      You have been granted <strong style="color:#202124">{{ROLE}}</strong> access to the analytics portal for <strong style="color:#202124">riengradio.co.ke</strong>.
                    </p>
                    <p style="margin:12px 0 0;font-size:15px;line-height:24px;color:#5f6368">
                      Use the button below to open your report access.
                    </p>
                  </td>
                </tr>

                <tr>
                  <td style="padding:22px 40px 14px 40px">
                    <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                      <tr>
                        <td bgcolor="#1a73e8" style="border-radius:5px">
                          <a href="{{ACCESS_URL}}" style="display:inline-block;padding:12px 22px;font-size:14px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:5px">View analytics</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>

                <tr>
                  <td style="padding:8px 40px 30px 40px">
                    <p style="margin:0;font-size:15px;line-height:24px;color:#5f6368">
                      Sincerely,<br>
                      <strong style="color:#3c4043;font-weight:500">Analytics Team</strong>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:18px 24px 0 24px;font-size:11px;line-height:18px;color:#9aa0a6">
              Rieng Radio Analytics · Secure report access
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
