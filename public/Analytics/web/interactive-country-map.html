L564.387,308.367L563.709,309.148L562.015,309.148L561.016,308.308L558.75,309.346L558.018,310.383L556.368,310.185L555.815,309.9L555.235,309.967L554.459,309.942L551.319,307.833L549.598,307.833L548.75,307.018L548.75,305.622L547.457,305.206L545.994,302.5L544.861,301.922L544.433,300.928L543.175,299.713L541.65,299.536L542.497,298.114L543.809,298.055L544.183,297.29L544.148,295.045L544.879,292.427L546.057,291.723L546.306,290.7L547.368,288.783L548.866,287.536L549.865,285.054L550.267,282.882L553.148,283.413L553.924,281.524L555.423,282.673L556.877,282.077L557.474,282.608L559.178,282.638L561.337,283.652L561.97,284.524L563.076,285.336L564.093,286.812L564.94,287.626L564.066,288.737L563.228,289.914L563.424,290.607L563.46,291.371L564.842,291.414L565.44,291.235L565.993,291.685L565.449,292.572L566.368,293.949L567.277,295.155L568.223,296.044L576.331,299.009Z"/><path class="c" data-n="Uganda" d="M544.005,321.219L538.956,321.407L536.244,321.378L535.37,321.676L533.89,322.439L533.292,322.187L533.31,320.317L533.89,319.373L534.023,317.381L534.55,316.232L535.495,314.94L536.45,314.282L537.244,313.4L536.253,313.065L536.396,310.164L537.422,309.488L538.992,310.043L540.99,309.463L542.729,309.467L544.255,308.325L545.432,310.051L545.718,311.294L546.815,314.139L545.914,315.947L544.692,317.587L543.978,318.589Z"/></svg><div id="tip" role="status" aria-live="polite"></div></div>
<script>
(()=>{
  let DATA={},total=0,max=0,selected=null;
  const tip=document.getElementById('tip');
  const box=document.querySelector('.mapbox');
  const svg=document.getElementById('map');
  const paths=[...svg.querySelectorAll('.c')];
  const fmt=n=>Number(n||0).toLocaleString('en-US');
  const aliases={'South Sudan':'S. Sudan'};
  const mapName=name=>aliases[name]||name;

  function rebuild(data){
    DATA={};
    if(Array.isArray(data)){
      data.forEach(row=>{
        const name=String(row?.label??row?.country??'').trim();
        const users=Number(row?.users??row?.value??0);
        if(name&&Number.isFinite(users)&&users>0)DATA[mapName(name)]=users;
      });
    }else if(data&&typeof data==='object'){
      Object.entries(data).forEach(([name,value])=>{
        const users=Number(value);
        if(name&&Number.isFinite(users)&&users>0)DATA[mapName(name)]=users;
      });
    }
    total=Object.values(DATA).reduce((sum,n)=>sum+n,0);
    max=Math.max(0,...Object.values(DATA));
    paths.forEach(path=>{
      const name=path.dataset.n;
      const users=DATA[name]||0;
      path.classList.toggle('d',users>0);
      path.style.fillOpacity=users&&max?(0.30+0.70*Math.sqrt(users/max)).toFixed(2):'1';
      path.setAttribute('aria-label',name+(users?': '+fmt(users)+' users':': no data'));
      if(!users&&path===selected)select(path);
    });
  }

  function showTip(path,event){
    const name=path.dataset.n,users=DATA[name]||0;
    tip.innerHTML='<b>'+name+'</b>'+(users
      ? '<span>Users</span> '+fmt(users)+' <span>('+(total?users/total*100:0).toFixed(1)+'%)</span>'
      : '<span>No data</span>');
    const rect=box.getBoundingClientRect();
    let x=event.clientX-rect.left+14;
    let y=event.clientY-rect.top+14;
    tip.style.opacity='1';
    const tw=tip.offsetWidth,th=tip.offsetHeight;
    if(x+tw>rect.width)x=event.clientX-rect.left-tw-14;
    if(y+th>rect.height)y=Math.max(0,event.clientY-rect.top-th-14);
    tip.style.left=Math.max(0,x)+'px';
    tip.style.top=Math.max(0,y)+'px';
  }

  function select(path){
    if(selected)selected.classList.remove('sel');
    selected=selected===path?null:path;
    if(selected){selected.classList.add('sel');svg.appendChild(selected)}
  }

  paths.forEach(path=>{
    path.setAttribute('tabindex','0');
    path.setAttribute('role','button');
    path.addEventListener('pointermove',event=>showTip(path,event));
    path.addEventListener('pointerleave',()=>{tip.style.opacity='0'});
    path.addEventListener('click',event=>{select(path);showTip(path,event)});
    path.addEventListener('keydown',event=>{
      if(event.key==='Enter'||event.key===' '){event.preventDefault();select(path)}
    });
  });
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&selected)select(selected)});
  addEventListener('message',event=>{
    if(event.origin!==location.origin)return;
    if(event.data?.type==='rieng-country-map-data')rebuild(event.data.data);
  });
  parent.postMessage({type:'rieng-country-map-ready'},location.origin);
  rebuild({});
})();
</script>
