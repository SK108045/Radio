name: Rebuild Politics poster

on:
  push:
    branches: [main]
    paths:
      - '.poster_upload/**'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild poster
        shell: bash
        run: |
          cat .poster_upload/part*.b64 | base64 --decode > public/shows/politics-show-2027.avif
          test "$(stat -c%s public/shows/politics-show-2027.avif)" -gt 15000
          file public/shows/politics-show-2027.avif
          sed -i "s|/shows/politics-show-2027.jpg|/shows/politics-show-2027.avif|" lib/showSchedule.ts
      - name: Commit rebuilt asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/shows/politics-show-2027.avif lib/showSchedule.ts
          git rm -r .poster_upload
          git commit -m "Install high-quality Politics Show poster"
          git push
